<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="cwSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="glassPane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.75)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.5)" />
      <stop offset="100%" stop-color="rgba(2, 132, 199, 0.85)" />
    </linearGradient>
    <linearGradient id="mullionGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#cwSky)" />
  <rect x="0" y="520" width="800" height="80" fill="#1e293b" />

  <!-- 3-Story Commercial Glass Curtain Wall Building Facade -->
  <rect x="80" y="40" width="640" height="480" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />

  <!-- Glass Panes Grid (Panasap Tinted Solar Control) -->
  <!-- Floor 3 -->
  <g>
    <rect x="100" y="60" width="140" height="130" fill="url(#glassPane)" />
    <rect x="250" y="60" width="140" height="130" fill="url(#glassPane)" />
    <rect x="400" y="60" width="140" height="130" fill="url(#glassPane)" />
    <rect x="550" y="60" width="140" height="130" fill="url(#glassPane)" />
  </g>
  <!-- Floor 2 -->
  <g>
    <rect x="100" y="210" width="140" height="130" fill="url(#glassPane)" />
    <rect x="250" y="210" width="140" height="130" fill="url(#glassPane)" />
    <rect x="400" y="210" width="140" height="130" fill="url(#glassPane)" />
    <rect x="550" y="210" width="140" height="130" fill="url(#glassPane)" />
  </g>
  <!-- Floor 1 (Lobby / Ground) -->
  <g>
    <rect x="100" y="360" width="140" height="140" fill="url(#glassPane)" />
    <rect x="250" y="360" width="140" height="140" fill="url(#glassPane)" />
    <rect x="400" y="360" width="140" height="140" fill="url(#glassPane)" />
    <rect x="550" y="360" width="140" height="140" fill="url(#glassPane)" />
  </g>

  <!-- Heavy Duty Vertical Back Mullions (150mm x 50mm) -->
  <rect x="90" y="40" width="12" height="480" fill="url(#mullionGrad)" />
  <rect x="240" y="40" width="12" height="480" fill="url(#mullionGrad)" />
  <rect x="390" y="40" width="12" height="480" fill="url(#mullionGrad)" />
  <rect x="540" y="40" width="12" height="480" fill="url(#mullionGrad)" />
  <rect x="690" y="40" width="12" height="480" fill="url(#mullionGrad)" />

  <!-- Horizontal Transoms (Intermediate Floor Beams) -->
  <rect x="90" y="40" width="612" height="12" fill="url(#mullionGrad)" />
  <rect x="90" y="195" width="612" height="14" fill="url(#mullionGrad)" />
  <rect x="90" y="345" width="612" height="14" fill="url(#mullionGrad)" />
  <rect x="90" y="505" width="612" height="15" fill="url(#mullionGrad)" />

  <!-- Diagonal Light Sheen across Glazing -->
  <polygon points="120,60 220,60 620,500 520,500" fill="rgba(255,255,255,0.18)" />
  <polygon points="260,60 330,60 670,450 600,450" fill="rgba(255,255,255,0.12)" />

  <!-- Architecture Spec Pill Tag in Vector -->
  <g transform="translate(30, 480)">
    <rect width="280" height="70" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="16" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURTAIN WALL STICK SYSTEM</text>
    <text x="16" y="44" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Back Mullion 150mm + Panasap 6mm</text>
    <text x="16" y="59" fill="#94a3b8" font-family="sans-serif" font-size="11">Structural Sealant & Anchor Siku Baja</text>
  </g>
</svg>
