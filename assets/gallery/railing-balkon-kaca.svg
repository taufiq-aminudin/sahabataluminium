<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="terraceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="baseShoeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="30%" stop-color="#475569" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="balconyGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(186, 230, 253, 0.55)" />
      <stop offset="50%" stop-color="rgba(224, 242, 254, 0.3)" />
      <stop offset="100%" stop-color="rgba(125, 211, 252, 0.45)" />
    </linearGradient>
    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0)" />
      <stop offset="45%" stop-color="rgba(255, 255, 255, 0)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.6)" />
      <stop offset="55%" stop-color="rgba(255, 255, 255, 0)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>
  </defs>

  <!-- Sky & Landscape Backdrop -->
  <rect width="800" height="420" fill="url(#skyGrad)" />
  <circle cx="680" cy="110" r="45" fill="#fef08a" opacity="0.6" />

  <!-- Distant Cityscape Silhouette -->
  <polygon points="50,420 50,340 90,340 90,310 130,310 130,420" fill="#cbd5e1" opacity="0.6" />
  <polygon points="150,420 150,290 200,290 200,420" fill="#94a3b8" opacity="0.5" />
  <polygon points="220,420 220,330 270,330 270,420" fill="#cbd5e1" opacity="0.6" />
  <polygon points="520,420 520,300 580,300 580,420" fill="#94a3b8" opacity="0.5" />
  <polygon points="600,420 600,320 660,320 660,420" fill="#cbd5e1" opacity="0.6" />

  <!-- Terrace Floor (Concrete Tile Floor) -->
  <polygon points="0,420 800,420 800,600 0,600" fill="url(#terraceGrad)" />
  <line x1="200" y1="420" x2="100" y2="600" stroke="#475569" stroke-width="1.5" />
  <line x1="400" y1="420" x2="350" y2="600" stroke="#475569" stroke-width="1.5" />
  <line x1="600" y1="420" x2="620" y2="600" stroke="#475569" stroke-width="1.5" />

  <!-- Recessed Base Shoe (Aluminium U-Channel Tanam) -->
  <rect x="30" y="405" width="740" height="35" rx="3" fill="url(#baseShoeGrad)" stroke="#64748b" stroke-width="1.5" />
  <line x1="30" y1="408" x2="770" y2="408" stroke="#94a3b8" stroke-width="2" />
  <line x1="30" y1="435" x2="770" y2="435" stroke="#0f172a" stroke-width="2" />

  <!-- 3 Balcony Frameless Glass Panels (Tempered Laminated 12mm) -->
  <!-- Glass Panel 1 (Left) -->
  <rect x="40" y="160" width="230" height="250" rx="3" fill="url(#balconyGlass)" stroke="rgba(14, 165, 233, 0.85)" stroke-width="2.5" />
  <rect x="40" y="160" width="230" height="250" fill="url(#reflection)" />
  <line x1="40" y1="160" x2="270" y2="160" stroke="#f0f9ff" stroke-width="4" stroke-linecap="round" />

  <!-- Glass Panel 2 (Center) -->
  <rect x="285" y="160" width="230" height="250" rx="3" fill="url(#balconyGlass)" stroke="rgba(14, 165, 233, 0.85)" stroke-width="2.5" />
  <rect x="285" y="160" width="230" height="250" fill="url(#reflection)" />
  <line x1="285" y1="160" x2="515" y2="160" stroke="#f0f9ff" stroke-width="4" stroke-linecap="round" />

  <!-- Glass Panel 3 (Right) -->
  <rect x="530" y="160" width="230" height="250" rx="3" fill="url(#balconyGlass)" stroke="rgba(14, 165, 233, 0.85)" stroke-width="2.5" />
  <rect x="530" y="160" width="230" height="250" fill="url(#reflection)" />
  <line x1="530" y1="160" x2="760" y2="160" stroke="#f0f9ff" stroke-width="4" stroke-linecap="round" />

  <!-- Slim Stainless Steel Top Edge Channel (U-Profile / Top Cap) -->
  <rect x="38" y="156" width="234" height="8" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  <rect x="283" y="156" width="234" height="8" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />
  <rect x="528" y="156" width="234" height="8" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1" />

  <!-- Spec & Branding Badge Overlay -->
  <rect x="30" y="30" width="340" height="70" rx="10" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <circle cx="55" cy="65" r="14" fill="#0284c7" />
  <text x="55" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">✓</text>
  <text x="80" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" font-weight="700">Railing Balkon U-Channel Tanam</text>
  <text x="80" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94a3b8">Kaca Tempered Laminated 6+6mm • Base Shoe</text>

  <!-- Status / Replacement Label -->
  <g transform="translate(560, 530)">
    <rect width="210" height="40" rx="8" fill="rgba(7, 46, 59, 0.92)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
    <circle cx="20" cy="20" r="5" fill="#38bdf8" />
    <text x="34" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#f8fafc" font-weight="600">Dokumentasi Asli Sahabat</text>
  </g>
</svg>
