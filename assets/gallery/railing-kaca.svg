<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="stepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(224, 242, 254, 0.45)" />
      <stop offset="30%" stop-color="rgba(186, 230, 253, 0.25)" />
      <stop offset="70%" stop-color="rgba(125, 211, 252, 0.35)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.2)" />
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0)" />
      <stop offset="45%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.55)" />
      <stop offset="55%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>
    <linearGradient id="spigotGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="handrailGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="80%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glassShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Interior Wall & Floor -->
  <rect width="800" height="600" fill="url(#wallGrad)" />

  <!-- Architectural Grid / Modern Wall Pattern -->
  <line x1="0" y1="120" x2="800" y2="120" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />
  <line x1="0" y1="260" x2="800" y2="260" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />
  <line x1="280" y1="0" x2="280" y2="600" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Staircase Base Steps (Rising from bottom-left to top-right) -->
  <!-- Step 1 -->
  <polygon points="40,560 220,560 220,520 40,520" fill="url(#stepGrad)" stroke="#64748b" stroke-width="1.5" />
  <!-- Step 2 -->
  <polygon points="140,520 320,520 320,460 140,460" fill="url(#stepGrad)" stroke="#64748b" stroke-width="1.5" />
  <!-- Step 3 -->
  <polygon points="240,460 420,460 420,400 240,400" fill="url(#stepGrad)" stroke="#64748b" stroke-width="1.5" />
  <!-- Step 4 -->
  <polygon points="340,400 520,400 520,340 340,340" fill="url(#stepGrad)" stroke="#64748b" stroke-width="1.5" />
  <!-- Step 5 -->
  <polygon points="440,340 620,340 620,280 440,280" fill="url(#stepGrad)" stroke="#64748b" stroke-width="1.5" />
  <!-- Step 6 (Top Landing) -->
  <polygon points="540,280 780,280 780,220 540,220" fill="url(#stepGrad)" stroke="#64748b" stroke-width="1.5" />

  <!-- Frameless Tempered Glass Staircase Panels (3 Sections along staircase slope) -->
  <!-- Panel 1 (Lower) -->
  <polygon points="90,510 270,410 270,190 90,290" fill="url(#glassGrad)" stroke="rgba(14, 165, 233, 0.7)" stroke-width="2.5" filter="url(#glassShadow)" />
  <polygon points="90,510 270,410 270,190 90,290" fill="url(#glassSheen)" />

  <!-- Panel 2 (Middle) -->
  <polygon points="280,405 460,305 460,85 280,185" fill="url(#glassGrad)" stroke="rgba(14, 165, 233, 0.7)" stroke-width="2.5" filter="url(#glassShadow)" />
  <polygon points="280,405 460,305 460,85 280,185" fill="url(#glassSheen)" />

  <!-- Panel 3 (Upper Landing) -->
  <polygon points="470,300 750,300 750,80 470,80" fill="url(#glassGrad)" stroke="rgba(14, 165, 233, 0.7)" stroke-width="2.5" filter="url(#glassShadow)" />
  <polygon points="470,300 750,300 750,80 470,80" fill="url(#glassSheen)" />

  <!-- Stainless Steel Spigot Clamps SUS304 (Heavy Duty Floor Fixtures) -->
  <!-- Panel 1 Spigots -->
  <rect x="120" y="475" width="22" height="42" rx="4" fill="url(#spigotGrad)" stroke="#334155" stroke-width="1.2" />
  <circle cx="131" cy="490" r="3.5" fill="#334155" />
  <rect x="230" y="415" width="22" height="42" rx="4" fill="url(#spigotGrad)" stroke="#334155" stroke-width="1.2" />
  <circle cx="241" cy="430" r="3.5" fill="#334155" />

  <!-- Panel 2 Spigots -->
  <rect x="310" y="370" width="22" height="42" rx="4" fill="url(#spigotGrad)" stroke="#334155" stroke-width="1.2" />
  <circle cx="321" cy="385" r="3.5" fill="#334155" />
  <rect x="420" y="310" width="22" height="42" rx="4" fill="url(#spigotGrad)" stroke="#334155" stroke-width="1.2" />
  <circle cx="431" cy="325" r="3.5" fill="#334155" />

  <!-- Panel 3 Spigots (Landing) -->
  <rect x="520" y="275" width="22" height="42" rx="4" fill="url(#spigotGrad)" stroke="#334155" stroke-width="1.2" />
  <circle cx="531" cy="290" r="3.5" fill="#334155" />
  <rect x="680" y="275" width="22" height="42" rx="4" fill="url(#spigotGrad)" stroke="#334155" stroke-width="1.2" />
  <circle cx="691" cy="290" r="3.5" fill="#334155" />

  <!-- Minimalist Top Handrail / Glass Edge Cap (Stainless Steel 304 Profile) -->
  <line x1="88" y1="289" x2="272" y2="189" stroke="url(#handrailGrad)" stroke-width="12" stroke-linecap="round" />
  <line x1="278" y1="184" x2="462" y2="84" stroke="url(#handrailGrad)" stroke-width="12" stroke-linecap="round" />
  <line x1="468" y1="79" x2="752" y2="79" stroke="url(#handrailGrad)" stroke-width="12" stroke-linecap="round" />

  <!-- Spec & Branding Badge Overlay -->
  <rect x="30" y="30" width="310" height="70" rx="10" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <circle cx="55" cy="65" r="14" fill="#0284c7" />
  <text x="55" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">✓</text>
  <text x="80" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#ffffff" font-weight="700">Railing Tangga Kaca Frameless</text>
  <text x="80" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#94a3b8">Kaca Tempered 12mm • Spigot SUS304</text>

  <!-- Status / Replacement Label -->
  <g transform="translate(560, 530)">
    <rect width="210" height="40" rx="8" fill="rgba(7, 46, 59, 0.92)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
    <circle cx="20" cy="20" r="5" fill="#38bdf8" />
    <text x="34" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#f8fafc" font-weight="600">Dokumentasi Asli Sahabat</text>
  </g>
</svg>
