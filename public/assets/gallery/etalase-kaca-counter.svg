<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="shopBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="aluFrame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="goldHollow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="etalaseGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(240, 249, 255, 0.4)" />
      <stop offset="50%" stop-color="rgba(186, 230, 253, 0.2)" />
      <stop offset="100%" stop-color="rgba(125, 211, 252, 0.35)" />
    </linearGradient>
    <linearGradient id="ledStrip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#shopBg)" />
  <rect x="0" y="480" width="800" height="120" fill="#0f172a" />
  <line x1="0" y1="480" x2="800" y2="480" stroke="#334155" stroke-width="2" />

  <!-- Boutique / Jewelry Store Showcase Counter (3D Isometric Perspective) -->
  <!-- Showcase Base / Cabinet Plinth -->
  <polygon points="120,440 680,440 680,490 120,490" fill="url(#goldHollow)" stroke="#475569" stroke-width="2" />
  <!-- Swivel Caster Wheels with Locks -->
  <rect x="150" y="490" width="16" height="14" rx="3" fill="#64748b" />
  <rect x="320" y="490" width="16" height="14" rx="3" fill="#64748b" />
  <rect x="490" y="490" width="16" height="14" rx="3" fill="#64748b" />
  <rect x="640" y="490" width="16" height="14" rx="3" fill="#64748b" />

  <!-- Main Glass Display Box (P 150cm x L 50cm x T 100cm) -->
  <rect x="120" y="160" width="560" height="280" fill="url(#etalaseGlass)" stroke="url(#aluFrame)" stroke-width="8" rx="2" />

  <!-- Top Glass Counter Top (Tempered Clear 8mm Flat Polished) -->
  <polygon points="120,160 680,160 690,170 110,170" fill="rgba(255,255,255,0.6)" />

  <!-- Internal Glass Shelves (2 Tiers with Stainless Shelf Pegs) -->
  <!-- Shelf 1 -->
  <rect x="130" y="260" width="540" height="8" fill="rgba(255,255,255,0.5)" stroke="#94a3b8" stroke-width="1" />
  <!-- Shelf 2 -->
  <rect x="130" y="350" width="540" height="8" fill="rgba(255,255,255,0.5)" stroke="#94a3b8" stroke-width="1" />

  <!-- Shelf Brackets SUS304 -->
  <circle cx="140" cy="264" r="5" fill="#e2e8f0" />
  <circle cx="660" cy="264" r="5" fill="#e2e8f0" />
  <circle cx="140" cy="354" r="5" fill="#e2e8f0" />
  <circle cx="660" cy="354" r="5" fill="#e2e8f0" />

  <!-- Hidden Warm LED Strip Under Top Frame -->
  <rect x="126" y="170" width="548" height="4" fill="url(#ledStrip)" />
  <polygon points="126,174 674,174 660,240 140,240" fill="rgba(254, 240, 138, 0.12)" />

  <!-- Sliding Rear Glass Door Overlap Line & Lock -->
  <line x1="400" y1="168" x2="400" y2="436" stroke="rgba(255,255,255,0.7)" stroke-width="3" />
  <!-- Sawtooth Lock (Kunci Gergaji Huben) -->
  <rect x="390" y="295" width="20" height="12" fill="#f8fafc" stroke="#0f172a" stroke-width="1" rx="2" />
  <circle cx="400" cy="301" r="2.5" fill="#0f172a" />

  <!-- Glass Sheen Highlights -->
  <polygon points="160,170 260,170 210,430 140,430" fill="rgba(255,255,255,0.2)" />
  <polygon points="560,170 630,170 600,430 540,430" fill="rgba(255,255,255,0.15)" />

  <!-- Architecture Spec Pill Tag in Vector -->
  <g transform="translate(30, 480)">
    <rect width="280" height="70" rx="8" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="16" y="26" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="1">ETALASE KACA TOKO EMAS & COUNTER</text>
    <text x="16" y="44" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Frame Aluminium Anodize + LED Strip</text>
    <text x="16" y="59" fill="#94a3b8" font-family="sans-serif" font-size="11">Kaca Polos 6mm SNI + Kunci Pengaman Huben</text>
  </g>
</svg>
